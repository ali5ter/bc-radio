name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # oto's PortAudio backend is cgo; the build needs the ALSA headers on
      # Linux even though the release pipeline only ships darwin binaries.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
