name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# bc-radio is cgo (PortAudio) and cannot cross-compile between OSes; darwin
# arm64 -> amd64 does work natively, so one macOS runner builds both
# published architectures.
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
